# Puerto del servidor
server.port=8080

# Config DB
spring.datasource.url=jdbc:mysql://localhost:3306/almita_virtual_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# JWT Configuration
jwt.secret=J$7gXv9e!T4bqR2@hW1zK8mP0cLr#X6Y
jwt.expiration=86400000

# Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# AWS S3 Configuration
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY}
cloud.aws.credentials.secret-key=${AWS_SECRET_KEY}
cloud.aws.region.static=eu-north-1
cloud.aws.stack.auto=false
aws.s3.bucket=almita-virtual-archivos

# Activar cache con Caffeine
spring.cache.type=caffeine
# Política de Caffeine: duración máxima 10 minutos por entrada
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=10m

# Tamaño máximo de archivo y de solicitud para subir archivos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Reducir ruido en consola
logging.level.root=INFO
logging.level.org.hibernate.SQL=ERROR
logging.level.org.springframework.web=ERROR
logging.level.org.springframework.security=ERROR